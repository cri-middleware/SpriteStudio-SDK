[workspace]
resolver = "3"
members = [
    "cli",
    "libs/ssconverter",
    "libs/sspj",
    "libs/ssab",
    "libs/ssruntime",
    "libs/ssinterpolate",
]

[workspace.dependencies]
sspj = { path = "libs/sspj" }
ssconverter = { path = "libs/ssconverter" }
ssab = { path = "libs/ssab" }
ssruntime = { path = "libs/ssruntime" }

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
panic = "abort"
strip = "symbols"
