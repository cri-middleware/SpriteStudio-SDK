[workspace]
resolver = "3"
members = [
    "cli",
    "libs/ssconverter",
    "libs/sspj",
    "libs/ssab",
    "libs/ssruntime",
    "libs/ssinterpolate",
]
[workspace.package]
version = "7.0.0-beta.1"
edition = "2024"
rust-version = "1.97"
authors = ["CRI Middleware Co., Ltd."]
license = "BSD-3-Clause"
repository = "https://github.com/cri-middleware/SpriteStudio-SDK"
homepage = "https://www.webtech.co.jp/eng/spritestudio/"
description = "Software development kit for OPTPiX SpriteStudio 7 projects"
keywords = ["spritestudio", "2d-animation", "gamedev", "motion-graphics", "skeletal"]
categories = ["game-development", "graphics", "multimedia", "no-std"]


[workspace.dependencies]
sspj = { path = "libs/sspj", default-features = false }
ssconverter = { path = "libs/ssconverter" }
ssab = { path = "libs/ssab", default-features = false }
ssruntime = { path = "libs/ssruntime" }
ssinterpolate = { path = "libs/ssinterpolate" }
flatbuffers = { version = "25.12.19", default-features = false }
wide = { version = "1.5.0", default-features = false }
libm = "0.2.16"
wasm-bindgen = { version = "0.2.126", default-features = false }
dlmalloc = "0.2.14"
rayon = "1.12.0"
# `default-features = false` is load-bearing: libc's default feature set enables
# `libc/std`, which would pull std into the pure-no_std `libc_alloc` deliverables.
libc = { version = "0.2.189", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
quick-xml = { version = "0.41.0", features = ["serialize"] }
clap = { version = "4.6.4", features = ["derive"] }
ordered-float = "5.3.0"
walkdir = "2.5.0"
js-sys = "0.3.103"
cbindgen = "0.29.4"
csbindgen = "1.9.8"
vergen-gitcl = { version = "10.0.1", features = ["build"] }

[profile.dev]
panic = "abort"

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
panic = "abort"
strip = "symbols"
