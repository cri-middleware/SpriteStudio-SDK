[workspace]
resolver = "3"
members = [
    "cli",
    "libs/ssconverter",
    "libs/sspj",
    "libs/ssab",
    "libs/ssruntime",
    "libs/ssinterpolate",
]
[workspace.package]
version = "7.0.0-alpha01"
edition = "2024"
rust-version = "1.95"
authors = ["CRI Middleware Co., Ltd."]
license-file = "LICENSE.md"
repository = "https://github.com/SpriteStudio/SpriteStudio7-SDK"
homepage = "https://www.webtech.co.jp/eng/spritestudio/"
description = "Software development kit for OPTPiX SpriteStudio 7 projects"


[workspace.dependencies]
sspj = { path = "libs/sspj" }
ssconverter = { path = "libs/ssconverter" }
ssab = { path = "libs/ssab", default-features = false }
ssruntime = { path = "libs/ssruntime" }
ssinterpolate = { path = "libs/ssinterpolate" }
flatbuffers = { version = "25.12.19", default-features = false }
wide = { version = "1.3.0", default-features = false }
libm = "0.2.16"
wasm-bindgen = { version = "0.2.120", default-features = false }
dlmalloc = "0.2.6"
rayon = "1.12.0"
cbindgen = "0.29.2"
vergen-gitcl = { version = "9.1.0", features = ["build"] }

[profile.dev]
panic = "abort"

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
panic = "abort"
strip = "symbols"
