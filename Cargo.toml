[workspace]
resolver = "3"
members = [
    "cli",
    "libs/ssconverter",
    "libs/sspj",
    "libs/ssab",
    "libs/ssruntime",
    "libs/ssinterpolate",
]

[workspace.package]
edition = "2024"

[workspace.dependencies]
sspj = { path = "libs/sspj" }
ssconverter = { path = "libs/ssconverter" }
ssab = { path = "libs/ssab", default-features = false }
ssruntime = { path = "libs/ssruntime" }
ssinterpolate = { path = "libs/ssinterpolate" }
flatbuffers = { version = "25.12.19", default-features = false }
libm = "0.2.16"
wasm-bindgen = "0.2.117"
rayon = "1.11.0"
cbindgen = "0.29.2"
vergen-gitcl = { version = "9.1.0", features = ["build"] }

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
panic = "abort"
strip = "symbols"
