name: release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      upload_release:
        description: 'Upload to GitHub Release'
        required: false
        default: false
        type: boolean

env:
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8
  PYTHONIOENCODING: utf8
  KEYCHAIN_PATH: app-signing.keychain-db

concurrency:
  group: ci-cargo-${{ github.actor }}-${{ github.head_ref || github.run_number }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 🐧 Linux (GCC)
            os: ubuntu-latest
            platform: linux
            arch: x86_64

          - name: 🏁 Windows (x86_64, MSVC)
            os: windows-latest
            platform: windows
            arch: x86_64

          - name: 🍎 macOS (universal)
            os: macos-latest
            platform: macos
            arch: universal

          - name: 🤖 Android (arm64)
            os: ubuntu-latest
            platform: android
            arch: arm64

          - name: 🍏 iOS (arm64)
            os: macos-latest
            platform: ios
            arch: universal

          - name: 🌐 Web (wasm32)
            os: ubuntu-latest
            platform: web
            arch: wasm32

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: setup for SpriteStudio7-SDK
        uses: ./.github/actions/setup
        with:
          platform: ${{ matrix.platform }}
          os: ${{ matrix.os }}

#      - name: Retrieve the secret and decode it to a file
#        if: matrix.platform == 'macos' || matrix.platform == 'ios'
#        env:
#          DEV_CERT_APPLICATION: ${{ secrets.DEV_CERT_APPLICATION }}
#          DEV_CERT_PASS: ${{ secrets.DEV_CERT_PASS }}
#          KC_PASS: ${{ secrets.KC_PASS }}
#        run: |
#          # create variables
#          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
#
#          # import certificate and provisioning profile from secrets
#          echo -n "$DEV_CERT_APPLICATION" | base64 --decode > $CERTIFICATE_PATH
#
#          # create temporary keychain
#          security create-keychain -p "$KC_PASS" ${{ env.KEYCHAIN_PATH }}
#          security set-keychain-settings -lut 21600 ${{ env.KEYCHAIN_PATH }}
#          security unlock-keychain -p "$KC_PASS" ${{ env.KEYCHAIN_PATH }}
#
#          # import certificate to keychain
#          security import $CERTIFICATE_PATH -P "$DEV_CERT_PASS" -f pkcs12 -k ${{ env.KEYCHAIN_PATH }} -T /usr/bin/codesign
#          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" ${{ env.KEYCHAIN_PATH }}
#          security list-keychain -d user -s ${{ env.KEYCHAIN_PATH }}

      - name: build Linux
        if: matrix.platform == 'linux' && matrix.arch == 'x86_64'
        run: |
          ./scripts/release-linux.sh
          mkdir -p bin
          cp -r target/release/ssconverter-cli bin/
          mkdir -p lib
          cp target/release/*.a lib/
          cp target/release/*.so lib/
          mkdir -p lib/include
          cp libs/ssruntime/target/ssruntime.h lib/include/
          cp libs/ssconverter/target/ssconverter.h lib/include/

      - name: build macOS
        if: matrix.platform == 'macos' && matrix.arch == 'universal'
        env:
          DEV_ID_APPLICATION: ${{ secrets.DEV_ID_APPLICATION }}
        run: |
          rustup target add aarch64-apple-darwin
          rustup target add x86_64-apple-darwin
          ./scripts/release-macos.sh

          # TODO: codesign
          # for f in ./target/universal-apple-darwin/release/*.dylib
          # do
          #   codesign --force --verify --verbose --keychain ${{ env.KEYCHAIN_PATH }} --sign "${DEV_ID_APPLICATION}" $f --deep --options runtime --timestamp
          # done
          # codesign --force --verify --verbose --keychain ${{ env.KEYCHAIN_PATH }} --sign "${DEV_ID_APPLICATION}" target/universal-apple-darwin/release/ssconverter-cli --deep --options runtime --timestamp
          # TODO: notary
          mkdir -p bin
          cp -r target/universal-apple-darwin/release/ssconverter-cli bin/
          mkdir -p lib
          cp target/universal-apple-darwin/release/*.a lib/
          cp target/universal-apple-darwin/release/*.dylib lib/

      - name: build iOS
        if: matrix.platform == 'ios' && matrix.arch == 'universal'
        env:
          DEV_ID_APPLICATION: ${{ secrets.DEV_ID_APPLICATION }}
        run: |
          rustup target add aarch64-apple-ios
          rustup target add x86_64-apple-ios
          ./scripts/release-ios.sh

          # TODO: codesign
          # for f in ./target/universal-apple-ios/release/*.dylib
          # do
          #   codesign --force --verify --verbose --keychain ${{ env.KEYCHAIN_PATH }} --sign "${DEV_ID_APPLICATION}" $f --deep --options runtime --timestamp
          # done

          mkdir -p lib
          cp target/universal-apple-ios/release/*.a lib/
          cp target/universal-apple-ios/release/*.dylib lib/


      - name: build Android
        if: matrix.platform == 'android'
        run: |
          cargo install cargo-ndk
          rustup target add aarch64-linux-android
          rustup target add armv7-linux-androideabi
          rustup target add x86_64-linux-android
          ./scripts/release-android.sh

          mkdir -p lib/arm64
          cp target/aarch64-linux-android/release/*.a lib/arm64/
          cp target/aarch64-linux-android/release/*.so lib/arm64/
          mkdir -p lib/armv7
          cp target/armv7-linux-androideabi/release/*.a lib/armv7/
          cp target/armv7-linux-androideabi/release/*.so lib/armv7/
          mkdir -p lib/x86_64
          cp target/x86_64-linux-android/release/*.a lib/x86_64/
          cp target/x86_64-linux-android/release/*.so lib/x86_64/

      - name: build Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          rustup target add x86_64-pc-windows-msvc
          ./scripts/release-windows.ps1
          mkdir bin
          mkdir bin/x86_64
          cp target/x86_64-pc-windows-msvc/release/ssconverter-cli.exe bin/x86_64/
          mkdir lib
          mkdir lib/x86_64
          cp target/x86_64-pc-windows-msvc/release/*.lib lib/x86_64/
          cp target/x86_64-pc-windows-msvc/release/*.dll lib/x86_64/

      - name: build Web
        if: matrix.platform == 'web'
        run: |
          rustup target add wasm32-unknown-unknown
          rustup toolchain install nightly
          rustup target add wasm32-unknown-unknown --toolchain nightly
          rustup component add rust-src --toolchain nightly
          
          ./scripts/release-emscripten.sh
          mkdir -p lib
          cp target/wasm32-unknown-unknown/release/*.a lib/
          
          # Use faster binary installer for wasm-pack
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
          ./scripts/release-web.sh
          cp -r pkg/runtime-web/release lib/runtime-web
          cp -r pkg/converter-web/release lib/converter-web

      - name: Upload artifact ssconverter-cli
        if: matrix.platform == 'windows' || matrix.platform == 'linux' || matrix.platform == 'macos'
        uses: actions/upload-artifact@v7
        with:
          name: ssconverter-cli-${{ matrix.platform }}
          path: bin
          if-no-files-found: error

      - name: Upload artifact libraries
        uses: actions/upload-artifact@v7
        with:
          name: spritestudio7-sdk-libraries-${{ matrix.platform }}
          path: lib
          if-no-files-found: error

  package:
    needs: release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - id: commit
        uses: prompt/actions-commit-hash@v4

      - name: Install cargo-about
        run: cargo install cargo-about --locked --features cli

      # Generate the third-party notices fresh from the current Cargo.lock into
      # target/licenses/ (not committed). Each shipped artifact gets the file
      # for its crate, pinned to the features that crate actually ships with.
      - name: Generate third-party license notices
        run: ./scripts/generate-licenses.sh

      - name: Zip all artifacts
        run: |
          cd artifacts

          rm -rf static
          mkdir -p static/runtime
          pushd static/runtime
          mkdir -p libs include
          pushd libs
          mkdir -p macos
          mkdir -p web
          mkdir -p ios
          mkdir -p linux/x86_64
          mkdir -p android/arm32
          mkdir -p android/arm64
          mkdir -p android/x86_64
          mkdir -p windows/x86_64
          popd # libs

          mv ../../spritestudio7-sdk-libraries-macos/libssconverter.a libs/macos/
          mv ../../spritestudio7-sdk-libraries-macos/libssruntime.a libs/macos/
          mv ../../spritestudio7-sdk-libraries-web/libssruntime.a libs/web/
          mv ../../spritestudio7-sdk-libraries-ios/libssruntime.a libs/ios/
          mv ../../spritestudio7-sdk-libraries-linux/libssconverter.a libs/linux/x86_64
          mv ../../spritestudio7-sdk-libraries-linux/libssruntime.a libs/linux/x86_64
          mv ../../spritestudio7-sdk-libraries-android/arm64/libssruntime.a libs/android/arm64
          mv ../../spritestudio7-sdk-libraries-android/armv7/libssruntime.a libs/android/arm32
          mv ../../spritestudio7-sdk-libraries-android/x86_64/libssruntime.a libs/android/x86_64
          mv ../../spritestudio7-sdk-libraries-windows/x86_64/ssconverter.lib libs/windows/x86_64
          mv ../../spritestudio7-sdk-libraries-windows/x86_64/ssruntime.lib libs/windows/x86_64

          cp ../../spritestudio7-sdk-libraries-linux/include/*.h include/

          echo ${{ steps.commit.outputs.hash }} > VERSION
          cp ../../../LICENSE.md ./
          cp ../../../target/licenses/THIRD-PARTY-LICENSES.ssruntime.md ./
          cp ../../../target/licenses/THIRD-PARTY-LICENSES.ssconverter.md ./
          # pushd libs/windows
          # cp x86_64/ssconverter.lib ssconverter.windows.editor.x86_64.lib
          # cp x86_64/ssconverter.lib ssconverter.windows.template_debug.x86_64.lib
          # cp x86_64/ssconverter.lib ssconverter.windows.template_release.x86_64.lib
          # cp x86_64/ssruntime.lib ssruntime.windows.editor.x86_64.lib
          # cp x86_64/ssruntime.lib ssruntime.windows.template_debug.x86_64.lib
          # cp x86_64/ssruntime.lib ssruntime.windows.template_release.x86_64.lib
          # popd # libs/windows

          popd # static/runtime

          rm -rf dynamic
          mkdir -p dynamic/runtime
          pushd dynamic/runtime
          mkdir -p libs include
          pushd libs
          mkdir -p macos
          mkdir -p ios
          mkdir -p linux/x86_64
          mkdir -p android/arm32
          mkdir -p android/arm64
          mkdir -p android/x86_64
          mkdir -p windows/x86_64
          popd # libs

          mv ../../spritestudio7-sdk-libraries-macos/libssconverter.dylib libs/macos/
          mv ../../spritestudio7-sdk-libraries-macos/libssruntime.dylib libs/macos/
          mv ../../spritestudio7-sdk-libraries-ios/libssruntime.dylib libs/ios/
          mv ../../spritestudio7-sdk-libraries-linux/libssconverter.so libs/linux/x86_64
          mv ../../spritestudio7-sdk-libraries-linux/libssruntime.so libs/linux/x86_64
          mv ../../spritestudio7-sdk-libraries-android/arm64/libssruntime.so libs/android/arm64
          mv ../../spritestudio7-sdk-libraries-android/armv7/libssruntime.so libs/android/arm32
          mv ../../spritestudio7-sdk-libraries-android/x86_64/libssruntime.so libs/android/x86_64
          mv ../../spritestudio7-sdk-libraries-windows/x86_64/ssconverter.dll libs/windows/x86_64
          mv ../../spritestudio7-sdk-libraries-windows/x86_64/ssruntime.dll libs/windows/x86_64

          mv ../../spritestudio7-sdk-libraries-linux/include/*.h include/

          echo ${{ steps.commit.outputs.hash }} > VERSION
          cp ../../../LICENSE.md ./
          cp ../../../target/licenses/THIRD-PARTY-LICENSES.ssruntime.md ./
          cp ../../../target/licenses/THIRD-PARTY-LICENSES.ssconverter.md ./

          popd # static/runtime

          rm -rf ../output
          mkdir -p ../output
          mv static ../output/
          mv dynamic ../output/

      - name: Upload final release package
        uses: actions/upload-artifact@v7
        with:
          name: spritestudio7-sdk-static-libs
          path: output/static

      - name: Upload final release package
        uses: actions/upload-artifact@v7
        with:
          name: spritestudio7-sdk-dynamic-libs
          path: output/dynamic

      - name: Archive release packages
        run: |
          mkdir -p release-dist
          zip -r release-dist/spritestudio7-sdk-static-libs.zip output/static
          zip -r release-dist/spritestudio7-sdk-dynamic-libs.zip output/dynamic

          # Web packages — wasm-pack already placed each crate's own LICENSE.md
          # in the package; add its third-party notice (generated by the
          # "Generate third-party license notices" step above), then zip.
          cp target/licenses/THIRD-PARTY-LICENSES.ssruntime.md artifacts/spritestudio7-sdk-libraries-web/runtime-web/THIRD-PARTY-LICENSES.md
          cp target/licenses/THIRD-PARTY-LICENSES.ssconverter.md artifacts/spritestudio7-sdk-libraries-web/converter-web/THIRD-PARTY-LICENSES.md
          zip -rj release-dist/spritestudio7-sdk-runtime-web.zip artifacts/spritestudio7-sdk-libraries-web/runtime-web/*
          zip -rj release-dist/spritestudio7-sdk-converter-web.zip artifacts/spritestudio7-sdk-libraries-web/converter-web/*

          for dir in artifacts/ssconverter-cli-*; do
            if [ -d "$dir" ]; then
              platform=${dir#artifacts/ssconverter-cli-}
              cp LICENSE.md "$dir"/
              cp target/licenses/THIRD-PARTY-LICENSES.cli.md "$dir"/THIRD-PARTY-LICENSES.md
              zip -rj "release-dist/ssconverter-cli-${platform}.zip" "$dir"
            fi
          done

      - name: Create GitHub Release
        if: |
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.upload_release == 'true')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release-dist/*.zip
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
