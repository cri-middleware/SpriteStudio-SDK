name: release
on:
  workflow_dispatch:
    inputs:
      upload_release:
        description: 'Upload to GitHub Release'
        required: false
        default: false
        type: boolean

env:
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8
  PYTHONIOENCODING: utf8
  KEYCHAIN_PATH: app-signing.keychain-db

concurrency:
  group: ci-cargo-${{ github.actor }}-${{ github.head_ref || github.run_number }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 🐧 Linux (x86_64, GCC)
            os: ubuntu-latest
            platform: linux
            arch: x86_64

          - name: 🐧 Linux (aarch64, GCC)
            os: ubuntu-24.04-arm
            platform: linux
            arch: aarch64

          - name: 🏁 Windows (x86_64, MSVC)
            os: windows-latest
            platform: windows
            arch: x86_64

          - name: 🍎 macOS (universal)
            os: macos-latest
            platform: macos
            arch: universal

          - name: 🤖 Android (arm64)
            os: ubuntu-latest
            platform: android
            arch: arm64

          - name: 🍏 iOS (arm64)
            os: macos-latest
            platform: ios
            arch: universal

          - name: 🌐 Web (wasm32)
            os: ubuntu-latest
            platform: web
            arch: wasm32

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: setup for SpriteStudio-SDK
        uses: ./.github/actions/setup
        with:
          platform: ${{ matrix.platform }}
          os: ${{ matrix.os }}

      # Import the Developer ID Application certificate into an ephemeral
      # keychain so codesign (run inside the release scripts) can find the
      # signing identity. No-ops when the certificate secret is absent, leaving
      # the artifacts unsigned.
      - name: Set up signing keychain
        if: matrix.platform == 'macos' || matrix.platform == 'ios'
        env:
          SS_APPLE_CERTIFICATE: ${{ secrets.SS_APPLE_CERTIFICATE }}
          SS_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.SS_APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$SS_APPLE_CERTIFICATE" ]; then
            echo "SS_APPLE_CERTIFICATE not set — skipping keychain setup (artifacts will be unsigned)."
            exit 0
          fi

          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          # Random per-run password for the throwaway keychain; never persisted.
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"

          echo -n "$SS_APPLE_CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"

          # Create, harden and unlock a temporary keychain.
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import the cert and authorize codesign to use its private key.
          security import "$CERTIFICATE_PATH" -P "$SS_APPLE_CERTIFICATE_PASSWORD" -f pkcs12 -k "$KEYCHAIN_PATH" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Put the keychain on the search list so codesign resolves the identity.
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db

          rm -f "$CERTIFICATE_PATH"

      # Decode the App Store Connect API key (.p8) used to notarize the CLI and
      # expose its path to the macOS build step. No-ops when the secret is
      # absent. macOS only (iOS is not notarized).
      - name: Prepare Apple API key
        if: matrix.platform == 'macos'
        env:
          SS_APPLE_API_KEY_BASE64: ${{ secrets.SS_APPLE_API_KEY_BASE64 }}
        run: |
          if [ -z "$SS_APPLE_API_KEY_BASE64" ]; then
            echo "SS_APPLE_API_KEY_BASE64 not set — skipping API key setup (CLI will not be notarized)."
            exit 0
          fi
          echo "$SS_APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/apple_api_key.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/apple_api_key.p8" >> "$GITHUB_ENV"

      - name: build Linux
        if: matrix.platform == 'linux'
        run: |
          ./scripts/release-linux.sh
          mkdir -p bin
          cp -r target/release/ssconverter-cli bin/
          mkdir -p lib
          cp target/release/*.a lib/
          cp target/release/*.so lib/
          mkdir -p lib/include
          # cbindgen emits both a plain-C header (.h) and a C++ header (.hpp);
          # ship both so consumers pick by extension (ffigen / C use .h,
          # Godot / C++ use .hpp).
          cp libs/ssruntime/target/ssruntime.h lib/include/
          cp libs/ssconverter/target/ssconverter.h lib/include/
          cp libs/ssruntime/target/ssruntime.hpp lib/include/
          cp libs/ssconverter/target/ssconverter.hpp lib/include/
          # csbindgen C# FFI bindings (platform-independent; Linux is the canonical
          # source, mirroring how the .h headers above are collected). Consumers
          # such as SSPlayerForUnity need these to compile against the libs.
          mkdir -p lib/bindings
          cp libs/ssruntime/target/SSRuntimeMethods.g.cs lib/bindings/
          cp libs/ssconverter/target/SSConverterMethods.g.cs lib/bindings/

      # release-macos.sh signs the universal dylibs + CLI (hardened runtime +
      # timestamp) and notarizes the CLI when these APPLE_* env vars are present.
      # APPLE_API_KEY_PATH is set by the "Prepare Apple API key" step above.
      - name: build macOS
        if: matrix.platform == 'macos' && matrix.arch == 'universal'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.SS_APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.SS_APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.SS_APPLE_API_KEY }}
        run: |
          rustup target add aarch64-apple-darwin
          rustup target add x86_64-apple-darwin
          ./scripts/release-macos.sh

          mkdir -p bin
          cp -r target/universal-apple-darwin/release/ssconverter-cli bin/
          mkdir -p lib
          cp target/universal-apple-darwin/release/*.a lib/
          cp target/universal-apple-darwin/release/*.dylib lib/
          # Unity consumes libssruntime as a .bundle (macOS's documented native-
          # plugin format). It has no version symlinks, so unlike the framework a
          # plain recursive copy survives the artifact upload/download and zip.
          cp -R target/universal-apple-darwin/release/ssruntime.bundle lib/
          # Tar the versioned libssruntime.framework so its version symlinks +
          # code signature survive the artifact upload/download and the final
          # `zip` (both of which would otherwise dereference symlinks and
          # invalidate the signature). The package job untars it into libs/macos/.
          tar -C target/universal-apple-darwin/release -cf lib/libssruntime.framework.tar libssruntime.framework

      # release-ios-xcframework.sh signs both xcframeworks (dynamic frameworks +
      # each bundle) when APPLE_SIGNING_IDENTITY is present (iOS is not notarized).
      - name: build iOS
        if: matrix.platform == 'ios' && matrix.arch == 'universal'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.SS_APPLE_SIGNING_IDENTITY }}
        run: |
          rustup target add aarch64-apple-ios
          rustup target add aarch64-apple-ios-sim
          rustup target add x86_64-apple-ios
          ./scripts/release-ios-xcframework.sh

          mkdir -p lib/static lib/dynamic
          cp -R target/xcframework/static/libssruntime.xcframework lib/static/
          cp -R target/xcframework/dynamic/libssruntime.xcframework lib/dynamic/


      - name: build Android
        if: matrix.platform == 'android'
        run: |
          cargo install cargo-ndk
          rustup target add aarch64-linux-android
          rustup target add armv7-linux-androideabi
          rustup target add x86_64-linux-android
          ./scripts/release-android.sh

          mkdir -p lib/arm64
          cp target/aarch64-linux-android/release/*.a lib/arm64/
          cp target/aarch64-linux-android/release/*.so lib/arm64/
          mkdir -p lib/armv7
          cp target/armv7-linux-androideabi/release/*.a lib/armv7/
          cp target/armv7-linux-androideabi/release/*.so lib/armv7/
          mkdir -p lib/x86_64
          cp target/x86_64-linux-android/release/*.a lib/x86_64/
          cp target/x86_64-linux-android/release/*.so lib/x86_64/

      - name: build Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          rustup target add x86_64-pc-windows-msvc
          ./scripts/release-windows.ps1
          mkdir bin
          mkdir bin/x86_64
          cp target/x86_64-pc-windows-msvc/release/ssconverter-cli.exe bin/x86_64/
          mkdir lib
          mkdir lib/x86_64
          cp target/x86_64-pc-windows-msvc/release/*.lib lib/x86_64/
          cp target/x86_64-pc-windows-msvc/release/*.dll lib/x86_64/

      - name: build Web
        if: matrix.platform == 'web'
        run: |
          rustup target add wasm32-unknown-unknown
          rustup toolchain install nightly
          rustup target add wasm32-unknown-unknown --toolchain nightly
          rustup component add rust-src --toolchain nightly
          
          ./scripts/release-emscripten.sh
          mkdir -p lib
          cp target/wasm32-unknown-unknown/release/*.a lib/
          
          # Use faster binary installer for wasm-pack
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
          ./scripts/release-web.sh
          cp -r pkg/runtime-web/release lib/runtime-web
          cp -r pkg/runtime-web-nosimd/release lib/runtime-web-nosimd
          cp -r pkg/converter-web/release lib/converter-web

      - name: Upload artifact ssconverter-cli
        if: matrix.platform == 'windows' || matrix.platform == 'linux' || matrix.platform == 'macos'
        uses: actions/upload-artifact@v7
        with:
          name: ssconverter-cli-${{ matrix.platform }}${{ (matrix.platform == 'linux' && matrix.arch == 'aarch64') && '-aarch64' || '' }}
          path: bin
          if-no-files-found: error

      - name: Upload artifact libraries
        uses: actions/upload-artifact@v7
        with:
          name: spritestudio-sdk-libraries-${{ matrix.platform }}${{ (matrix.platform == 'linux' && matrix.arch == 'aarch64') && '-aarch64' || '' }}
          path: lib
          if-no-files-found: error

  package:
    needs: release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - id: commit
        uses: prompt/actions-commit-hash@v4

      - name: Install cargo-about
        run: cargo install cargo-about --locked --features cli

      # Generate the third-party notices fresh from the current Cargo.lock into
      # target/licenses/ (not committed). Each shipped artifact gets the file
      # for its crate, pinned to the features that crate actually ships with.
      - name: Generate third-party license notices
        run: ./scripts/generate-licenses.sh

      - name: Zip all artifacts
        run: |
          cd artifacts

          rm -rf static
          mkdir -p static/runtime
          pushd static/runtime
          mkdir -p libs include
          pushd libs
          mkdir -p macos
          mkdir -p web
          mkdir -p ios
          mkdir -p linux/x86_64
          mkdir -p linux/aarch64
          mkdir -p android/armeabi-v7a
          mkdir -p android/arm64-v8a
          mkdir -p android/x86_64
          mkdir -p windows/x86_64
          popd # libs

          mv ../../spritestudio-sdk-libraries-macos/libssconverter.a libs/macos/
          mv ../../spritestudio-sdk-libraries-macos/libssruntime.a libs/macos/
          mv ../../spritestudio-sdk-libraries-web/libssruntime.a libs/web/
          mv ../../spritestudio-sdk-libraries-ios/static/libssruntime.xcframework libs/ios/
          mv ../../spritestudio-sdk-libraries-linux/libssconverter.a libs/linux/x86_64
          mv ../../spritestudio-sdk-libraries-linux/libssruntime.a libs/linux/x86_64
          mv ../../spritestudio-sdk-libraries-linux-aarch64/libssconverter.a libs/linux/aarch64
          mv ../../spritestudio-sdk-libraries-linux-aarch64/libssruntime.a libs/linux/aarch64
          mv ../../spritestudio-sdk-libraries-android/arm64/libssruntime.a libs/android/arm64-v8a
          mv ../../spritestudio-sdk-libraries-android/armv7/libssruntime.a libs/android/armeabi-v7a
          mv ../../spritestudio-sdk-libraries-android/x86_64/libssruntime.a libs/android/x86_64
          mv ../../spritestudio-sdk-libraries-windows/x86_64/ssconverter.lib libs/windows/x86_64
          mv ../../spritestudio-sdk-libraries-windows/x86_64/ssruntime.lib libs/windows/x86_64

          cp ../../spritestudio-sdk-libraries-linux/include/*.h ../../spritestudio-sdk-libraries-linux/include/*.hpp include/
          mkdir -p bindings
          cp ../../spritestudio-sdk-libraries-linux/bindings/*.g.cs bindings/

          echo ${{ steps.commit.outputs.hash }} > VERSION
          cp ../../../LICENSE.md ./
          cp ../../../target/licenses/THIRD-PARTY-LICENSES.ssruntime.md ./
          cp ../../../target/licenses/THIRD-PARTY-LICENSES.ssconverter.md ./
          # pushd libs/windows
          # cp x86_64/ssconverter.lib ssconverter.windows.editor.x86_64.lib
          # cp x86_64/ssconverter.lib ssconverter.windows.template_debug.x86_64.lib
          # cp x86_64/ssconverter.lib ssconverter.windows.template_release.x86_64.lib
          # cp x86_64/ssruntime.lib ssruntime.windows.editor.x86_64.lib
          # cp x86_64/ssruntime.lib ssruntime.windows.template_debug.x86_64.lib
          # cp x86_64/ssruntime.lib ssruntime.windows.template_release.x86_64.lib
          # popd # libs/windows

          popd # static/runtime

          rm -rf dynamic
          mkdir -p dynamic/runtime
          pushd dynamic/runtime
          mkdir -p libs include
          pushd libs
          mkdir -p macos
          mkdir -p ios
          mkdir -p linux/x86_64
          mkdir -p linux/aarch64
          mkdir -p android/armeabi-v7a
          mkdir -p android/arm64-v8a
          mkdir -p android/x86_64
          mkdir -p windows/x86_64
          popd # libs

          mv ../../spritestudio-sdk-libraries-macos/libssconverter.dylib libs/macos/
          # The macOS runtime ships as two wrappers of the same universal Mach-O:
          # a .bundle (Unity's native-plugin format) and a versioned .framework
          # (Ren'Py dlopens it by path; Flutter / CocoaPods link it via
          # vendored_frameworks, which cannot consume a loadable .bundle). The bare
          # standalone runtime dylib is no longer shipped — every consumer moved
          # off it. The bundle has no symlinks so a plain copy is fine; the
          # framework is untarred to restore its version symlinks + code signature.
          cp -R ../../spritestudio-sdk-libraries-macos/ssruntime.bundle libs/macos/
          tar -C libs/macos -xf ../../spritestudio-sdk-libraries-macos/libssruntime.framework.tar
          mv ../../spritestudio-sdk-libraries-ios/dynamic/libssruntime.xcframework libs/ios/
          mv ../../spritestudio-sdk-libraries-linux/libssconverter.so libs/linux/x86_64
          mv ../../spritestudio-sdk-libraries-linux/libssruntime.so libs/linux/x86_64
          mv ../../spritestudio-sdk-libraries-linux-aarch64/libssconverter.so libs/linux/aarch64
          mv ../../spritestudio-sdk-libraries-linux-aarch64/libssruntime.so libs/linux/aarch64
          mv ../../spritestudio-sdk-libraries-android/arm64/libssruntime.so libs/android/arm64-v8a
          mv ../../spritestudio-sdk-libraries-android/armv7/libssruntime.so libs/android/armeabi-v7a
          mv ../../spritestudio-sdk-libraries-android/x86_64/libssruntime.so libs/android/x86_64
          mv ../../spritestudio-sdk-libraries-windows/x86_64/ssconverter.dll libs/windows/x86_64
          mv ../../spritestudio-sdk-libraries-windows/x86_64/ssruntime.dll libs/windows/x86_64

          mv ../../spritestudio-sdk-libraries-linux/include/*.h ../../spritestudio-sdk-libraries-linux/include/*.hpp include/
          mkdir -p bindings
          cp ../../spritestudio-sdk-libraries-linux/bindings/*.g.cs bindings/

          echo ${{ steps.commit.outputs.hash }} > VERSION
          cp ../../../LICENSE.md ./
          cp ../../../target/licenses/THIRD-PARTY-LICENSES.ssruntime.md ./
          cp ../../../target/licenses/THIRD-PARTY-LICENSES.ssconverter.md ./

          popd # static/runtime

          rm -rf ../output
          mkdir -p ../output
          mv static ../output/
          mv dynamic ../output/

      - name: Upload final release package
        uses: actions/upload-artifact@v7
        with:
          name: spritestudio-sdk-static-libs
          path: output/static

      - name: Upload final release package
        uses: actions/upload-artifact@v7
        with:
          name: spritestudio-sdk-dynamic-libs
          path: output/dynamic

      - name: Archive release packages
        run: |
          mkdir -p release-dist
          zip -r release-dist/spritestudio-sdk-static-libs.zip output/static
          # -y (store symlinks) so the macOS libssruntime.framework's version
          # symlinks + code signature survive the zip; download-sdk's `unzip`
          # restores them on extract.
          zip -ry release-dist/spritestudio-sdk-dynamic-libs.zip output/dynamic

          # Web packages — wasm-pack already placed each crate's own LICENSE.md
          # in the package; add its third-party notice (generated by the
          # "Generate third-party license notices" step above), then zip.
          cp target/licenses/THIRD-PARTY-LICENSES.ssruntime.md artifacts/spritestudio-sdk-libraries-web/runtime-web/THIRD-PARTY-LICENSES.md
          cp target/licenses/THIRD-PARTY-LICENSES.ssruntime.md artifacts/spritestudio-sdk-libraries-web/runtime-web-nosimd/THIRD-PARTY-LICENSES.md
          cp target/licenses/THIRD-PARTY-LICENSES.ssconverter.md artifacts/spritestudio-sdk-libraries-web/converter-web/THIRD-PARTY-LICENSES.md
          zip -rj release-dist/spritestudio-sdk-runtime-web.zip artifacts/spritestudio-sdk-libraries-web/runtime-web/*
          zip -rj release-dist/spritestudio-sdk-runtime-web-nosimd.zip artifacts/spritestudio-sdk-libraries-web/runtime-web-nosimd/*
          zip -rj release-dist/spritestudio-sdk-converter-web.zip artifacts/spritestudio-sdk-libraries-web/converter-web/*

          for dir in artifacts/ssconverter-cli-*; do
            if [ -d "$dir" ]; then
              platform=${dir#artifacts/ssconverter-cli-}
              cp LICENSE.md "$dir"/
              cp target/licenses/THIRD-PARTY-LICENSES.cli.md "$dir"/THIRD-PARTY-LICENSES.md
              zip -rj "release-dist/ssconverter-cli-${platform}.zip" "$dir"
            fi
          done

          # Canonical checksum manifest so a consumer can verify each downloaded
          # zip's integrity (`sha256sum -c SHA256SUMS --ignore-missing` for a
          # partial download). Generated last, over every zip in release-dist.
          ( cd release-dist && sha256sum *.zip > SHA256SUMS )

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.upload_release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release-dist/*.zip
            release-dist/SHA256SUMS
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          # SemVer プレリリース (例: v7.0.0-alpha01) はタグ名に '-' を含むため
          # 自動的に prerelease 扱いにする。正式版 (v7.1.0) は false。
          prerelease: ${{ contains(github.ref_name, '-') }}
