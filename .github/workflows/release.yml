name: release 
on:
  workflow_dispatch:

env:
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8
  PYTHONIOENCODING: utf8
  KEYCHAIN_PATH: app-signing.keychain-db

concurrency:
  group: ci-cargo-${{ github.actor }}-${{ github.head_ref || github.run_number }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 🐧 Linux (GCC)
            os: ubuntu-latest
            platform: linux
            arch: x86_64

          - name: 🏁 Windows (x86_64, MSVC)
            os: windows-latest
            platform: windows
            arch: x86_64

          - name: 🍎 macOS (universal)
            os: macos-latest
            platform: macos
            arch: universal

          - name: 🤖 Android (arm64)
            os: ubuntu-latest
            platform: android
            arch: arm64

          - name: 🍏 iOS (arm64)
            os: macos-latest
            platform: ios
            arch: universal

          - name: 🌐 Web (wasm32)
            os: ubuntu-latest
            platform: web
            arch: wasm32

    defaults:
      run:
        shell: zsh {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: setup for release
        uses: ./.github/actions/setup-extension
        with:
          platform: ${{ matrix.platform }}
          os: ${{ matrix.os }}

      - name: Retrieve the secret and decode it to a file
        if: matrix.platform == 'macos' || matrix.platform == 'ios'
        env:
          DEV_CERT_APPLICATION: ${{ secrets.DEV_CERT_APPLICATION }}
          DEV_CERT_PASS: ${{ secrets.DEV_CERT_PASS }}
          KC_PASS: ${{ secrets.KC_PASS }}
        run: |
          # create variables
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12

          # import certificate and provisioning profile from secrets
          echo -n "$DEV_CERT_APPLICATION" | base64 --decode > $CERTIFICATE_PATH

          # create temporary keychain
          security create-keychain -p "$KC_PASS" ${{ env.KEYCHAIN_PATH }}
          security set-keychain-settings -lut 21600 ${{ env.KEYCHAIN_PATH }}
          security unlock-keychain -p "$KC_PASS" ${{ env.KEYCHAIN_PATH }}

          # import certificate to keychain
          security import $CERTIFICATE_PATH -P "$DEV_CERT_PASS" -f pkcs12 -k ${{ env.KEYCHAIN_PATH }} -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" ${{ env.KEYCHAIN_PATH }}
          security list-keychain -d user -s ${{ env.KEYCHAIN_PATH }}

      - name: build Linux
        if: matrix.platform == 'linux' && matrix.arch == 'x86_64'
        run: |
          ./scripts/release-linux.sh
          mkdir -p bin
          cp -r target/release/ssconverter-cli bin/

      - name: build macOS
        if: matrix.platform == 'macos' && matrix.arch == 'universal'
        env:
          DEV_ID_APPLICATION: ${{ secrets.DEV_ID_APPLICATION }}
        run: |
          rustup target add aarch64-apple-darwin
          rustup target add x86_64-apple-darwin
          ./scripts/release-macos.sh

          for f in ./target/universal-apple-darwin/*.dylib
          do
            codesign --force --verify --verbose --keychain ${{ env.KEYCHAIN_PATH }} --sign "${DEV_ID_APPLICATION}" $f --deep --options runtime --timestamp
          done
          codesign --force --verify --verbose --keychain ${{ env.KEYCHAIN_PATH }} --sign "${DEV_ID_APPLICATION}" ssconverter-cli --deep --options runtime --timestamp
          # TODO: notary
          mkdir -p bin
          cp -r target/universal-apple-darwin/ssconverter-cli bin/

      - name: build iOS
        if: matrix.platform == 'ios' && matrix.arch == 'universal'
        env:
          DEV_ID_APPLICATION: ${{ secrets.DEV_ID_APPLICATION }}
        run: |
          rustup target add aarch64-apple-ios
          rustup target add x86_64-apple-ios
          ./scripts/release-ios.sh

          for f in ./target/universal-apple-darwin/*.dylib
          do
            codesign --force --verify --verbose --keychain ${{ env.KEYCHAIN_PATH }} --sign "${DEV_ID_APPLICATION}" $f --deep --options runtime --timestamp
          done

      - name: build Android
        if: matrix.platform == 'android'
        run: |
          cargo install cargo-ndk
          rustup target add aarch64-linux-android
          rustup target add armv7-linux-androideabi
          rustup target add x86_64-linux-android
          ./scripts/release-android.sh

      - name: build Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          rustup target add x86_64-pc-windows-msvc
          rustup target add i686-pc-windows-msvc
          ./scripts/release-windows.ps1
          mkdir bin
          mkdir bin/x86_64
          mkdir bin/i686
          cp target/x86_64-pc-windows-msvc/release/ssconverter-cli.exe bin/x86_64/
          cp target/i686-pc-windows-msvc/release/ssconverter-cli.exe bin/i686/

      - name: build Web
        if: matrix.platform == 'web'
        run: |
          rustup target add wasm32-unknown-unknown
          ./scripts/release-wasm.sh

      - name: Upload artifact ssconverter-cli
        uses: actions/upload-artifact@v4
        with:
          name: ssconverter-cli-${{ matrix.platform }}
          path: bin
          if-no-files-found: error

      - name: Upload artifact libraries
        uses: actions/upload-artifact@v4
        with:
          name: spritestudio7-sdk-libraries-${{ matrix.platform }}
          path: target
          if-no-files-found: error

  package:
    needs: release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - id: commit
        uses: pr-mpt/actions-commit-hash@v3

      - name: Zip all artifacts
        run: |
          cd artifacts

          rm -rf static
          mkdir -p static/runtime
          cd static/runtime
          mkdir -p libs
          echo ${{ steps.commit.outputs }} > VERSION
          mkdir -p macos
          mkdir -p web
          mkdir -p ios
          mkdir -p linux/x86_64
          mkdir -p android/arm32
          mkdir -p android/arm64
          mkdir -p android/x86_64
          mkdir -p windows/x86_64
          cd ..

          mv ../../spritestudio7-sdk-libraries-macos/target/universal-apple-darwin/libssconverter.a libs/macos/
          mv ../../spritestudio7-sdk-libraries-macos/target/universal-apple-darwin/libssruntime.a libs/macos/
          mv ../../spritestudio7-sdk-libraries-web/target/wasm32-unknown-unknown/release/libssruntime.a libs/web/
          mv ../../spritestudio7-sdk-libraries-ios/target/universal-apple-ios/libssruntime.a libs/ios/
          mv ../../spritestudio7-sdk-libraries-linux/target/release/libssconverter.a libs/linux/x86_64
          mv ../../spritestudio7-sdk-libraries-linux/target/release/libssruntime.a libs/linux/x86_64
          mv ../../spritestudio7-sdk-libraries-android/target/aarch64-linux-android/release/libssruntime.a libs/android/arm64
          mv ../../spritestudio7-sdk-libraries-android/target/armv7-linux-androideabi/release/libssruntime.a libs/android/arm32
          mv ../../spritestudio7-sdk-libraries-android/target/x86_64-linux-android/release/libssruntime.a libs/android/x86_64
          mv ../../spritestudio7-sdk-libraries-windows/target/x86_64-pc-windows-msvc/release/ssconverter.lib libs/windows/x86_64
          mv ../../spritestudio7-sdk-libraries-windows/target/x86_64-pc-windows-msvc/release/ssruntime.lib libs/windows/x86_64
          cd libs/windows
          cp x86_64/ssconverter.lib ssconverter.windows.editor.x86_64.lib
          cp x86_64/ssconverter.lib ssconverter.windows.template_debug.x86_64.lib
          cp x86_64/ssconverter.lib ssconverter.windows.template_release.x86_64.lib
          cp x86_64/ssruntime.lib ssruntime.windows.editor.x86_64.lib
          cp x86_64/ssruntime.lib ssruntime.windows.template_debug.x86_64.lib
          cp x86_64/ssruntime.lib ssruntime.windows.template_release.x86_64.lib
          cd ../../

          # TODO: dynamic libraries
          # mkdir -p dynamic/runtime
          # cd dynamic/runtime
          # mkdir -p libs
          # echo ${{ steps.commit.outputs }} > VERSION
          # ...

          rm -rf ../output
          mkdir -p ../output
          mv static ../output/

      - name: Upload final release package
        uses: actions/upload-artifact@v4
        with:
          name: ssplayer-godot-extension-${{ env.GODOT_VERSION_4 }}-${{ steps.commit.outputs.short }}
          path: output/static
