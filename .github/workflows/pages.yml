name: Publish docs via GitHub Pages

# Builds the MkDocs site (the Player Porting Guide under libs/ssruntime/docs), grafts the
# workspace rustdoc onto it at /api/, and deploys the two as a single Pages artifact via the
# artifact method (no gh-pages branch) — matching the sibling player repositories.
#
# The published site is tied to releases, not to merges: a published release or a manual
# dispatch deploys, and nothing else does. This keeps the docs site in step with the release
# the SpriteStudio Docs portal links to, rather than running ahead of it on every merge.
# release.yml always creates the GitHub Release as a draft, so `published` is the moment a
# human publishes it from the UI — exactly the intended trigger.
#
# GitHub Pages must already be enabled on the repository with Source: GitHub Actions. There
# is no `configure-pages` step with `enablement: true`, so a repository that has never had
# Pages turned on fails at the deploy step rather than bootstrapping itself.
on:
  release:
    types: [published]
  workflow_dispatch:

# Read-only by default. Only the deploy job gets what the artifact-based Pages deploy
# needs (pages: write, id-token: write); the build job runs the repository's scripts and
# does not need them. No contents:write — nothing is pushed to a branch.
permissions:
  contents: read

# Never run two deploys at once; let an in-progress deploy finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # A Release deploys the site only when it becomes Latest
  # (scripts/release-channel.sh, read from the default branch): a pre-release
  # once its package has a full release, or a patch to an earlier line, leaves
  # the site as it is. A dispatch deploys from a tag, and refuses a branch such
  # as develop.
  channel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deploy: ${{ steps.channel.outputs.deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-tags: true
          persist-credentials: false
      - id: channel
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != release ]; then
            case "$GITHUB_REF" in
              refs/tags/*)
                echo "deploy=true" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
            esac
            echo "::error::a dispatch deploys from a tag, and ${GITHUB_REF_NAME} is a branch"
            exit 1
          fi
          channel="$(./scripts/release-channel.sh "$TAG")"
          echo "::notice::${TAG} is a ${channel} release"
          if [ "$channel" = latest ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: channel
    if: needs.channel.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.x
          cache: pip
          cache-dependency-path: docs/requirements.txt

      # Both steps below run the same scripts a contributor runs locally, rather than
      # repeating the commands here, and so does docs.yml, which builds the docs on a
      # pull request. That build catches what this one would hit only while both run
      # the scripts — the fewer places the build is spelled out, the better.
      #
      # prepare-docs.sh creates .venv and installs the pins from docs/requirements.txt;
      # build-pages.sh then finds zensical there. (It falls back to PATH when there is no
      # venv, so a plain `pip install -r docs/requirements.txt` step would still work here —
      # but then CI and the README would be running different things.) It stays a step of
      # its own so a dependency failure is legible as one in the run summary, which is also
      # why build-pages.sh is invoked below with prepare=no.
      - name: Install dependencies
        run: ./scripts/prepare-docs.sh

      # The rustdoc half of the site needs a toolchain; the documentation half does not.
      - name: setup for SpriteStudio-SDK
        uses: ./.github/actions/setup
        with:
          platform: linux
          os: ubuntu-latest

      # scripts/build-pages.sh is the whole site, in the order that works:
      #
      #   scripts/build-docs-tree.py first — the guide is authored with each page next to
      #   its `.ja.md` translation, which is what makes it readable on GitHub, while
      #   Zensical builds one locale per config from one directory. It generates those two
      #   directories, and fails if a page lost the language switcher line it must carry.
      #
      #   Then one build per locale, English first: the ja build writes into site/ja and
      #   the English build wipes site/ on the way in, so the opposite order publishes a
      #   site with no Japanese pages at all. Both --strict, which fails on a broken link or
      #   on a heading anchor renamed out from under a
      #   cross-reference. This run, docs.yml and the local build are the only gates
      #   there are.
      #
      #   Then `cargo doc --workspace --no-deps --all-features` grafted onto the site at
      #   /api/, with the redirect that covers anyone who trims the URL back to it —
      #   `cargo doc` writes no index.html at the root of a workspace, and the nav entry in
      #   both locale configs links straight to ssruntime. It lands at /api/ only, not
      #   /ja/api/: rustdoc output is English-only and both navs point at that one tree.
      #   Deliberately without `RUSTDOCFLAGS: -D warnings`, unlike the same command in
      #   ci.yml — that gate belongs on the pull request, and enforcing it again here would
      #   mean a single bad intra-doc link publishes no documentation at all rather than
      #   documentation with one bad link in it.
      #
      # build-pages.sh owns that order, and running it here is what keeps this workflow and
      # the local build from drifting apart — before it existed the graft lived only in this
      # file, so a locally built site had no /api/ for anyone to check.
      #
      # Every option is spelled out rather than left to the script's defaults: they are
      # chosen for a working tree, and a publish should not change because one of them did.
      - name: Build the Pages tree (docs both locales + rustdoc)
        run: ./scripts/build-pages.sh prepare=no docs=yes api=yes serve=no

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
