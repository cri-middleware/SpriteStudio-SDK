name: Weekly CI

on:
  schedule:
    # Every Sunday at 00:00 UTC (9:00 AM JST)
    - cron: '0 0 * * 0'
  # Windows / macOS / iOS / Android are not in the per-PR matrix, so a platform
  # break would otherwise sit unnoticed until the next Sunday run. Release
  # branches get the full matrix up front, when it is still cheap to fix.
  pull_request:
    branches:
      - 'release-*'
    paths-ignore:
      - '**/*.md'
      - '.gitignore'
      - 'LICENSE*'
  workflow_dispatch:

env:
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8
  PYTHONIOENCODING: utf8
  CARGO_TERM_COLOR: always

permissions:
  contents: read

concurrency:
  group: weekly-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 🏁 Windows (x86_64, MSVC)
            os: windows-latest
            platform: windows
            arch: x86_64

          - name: 🍎 macOS (universal)
            os: macos-latest
            platform: macos
            arch: universal

          - name: 🍏 iOS (arm64)
            os: macos-latest
            platform: ios
            arch: universal

          - name: 🤖 Android (arm64)
            os: ubuntu-latest
            platform: android
            arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: setup for SpriteStudio-SDK
        uses: ./.github/actions/setup
        with:
          platform: ${{ matrix.platform }}
          os: ${{ matrix.os }}

      - name: Install targets (Rust)
        run: |
          if [ "${{ matrix.platform }}" == "macos" ]; then
            rustup target add aarch64-apple-darwin
          elif [ "${{ matrix.platform }}" == "ios" ]; then
            rustup target add aarch64-apple-ios
          elif [ "${{ matrix.platform }}" == "android" ]; then
            rustup target add aarch64-linux-android
            cargo install cargo-ndk --locked
          fi
        shell: bash

      - name: Build
        run: |
          if [ "${{ matrix.platform }}" == "android" ]; then
            cargo ndk --target aarch64-linux-android build --verbose -p ssruntime-ffi --features "libc_alloc,panic-handler"
          elif [ "${{ matrix.platform }}" == "ios" ]; then
            cargo build --target aarch64-apple-ios --verbose -p ssruntime-ffi --features "libc_alloc,panic-handler"
          else
            cargo build --verbose
            cargo build --verbose -p ssruntime-ffi --features "libc_alloc,panic-handler"
          fi
        shell: bash

      - name: Test (workspace)
        if: matrix.platform == 'macos' || matrix.platform == 'windows'
        run: cargo test --workspace --all-features --verbose -- --test-threads=1
        shell: bash
