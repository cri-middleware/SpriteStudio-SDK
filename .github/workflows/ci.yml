name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8
  PYTHONIOENCODING: utf8
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-cargo-${{ github.actor }}-${{ github.head_ref || github.run_number }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: 💅 Lint & Format
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: setup for SpriteStudio7-SDK
        uses: ./.github/actions/setup
        with:
          platform: linux
          os: ubuntu-latest

      - name: Format Check
        run: cargo fmt --all -- --check
        shell: bash

      - name: Clippy (workspace)
        run: cargo clippy --workspace --all-targets -- -D warnings
        shell: bash

  ci:
    name: ${{ matrix.name }}
    needs: lint
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 🐧 Linux (GCC)
            os: ubuntu-latest
            platform: linux
            arch: x86_64

          - name: 🏁 Windows (x86_64, MSVC)
            os: windows-latest
            platform: windows
            arch: x86_64

          - name: 🍎 macOS (universal)
            os: macos-latest
            platform: macos
            arch: universal

          - name: 🤖 Android (arm64)
            os: ubuntu-latest
            platform: android
            arch: arm64

          - name: 🍏 iOS (arm64)
            os: macos-latest
            platform: ios
            arch: universal

          - name: 🌐 Web (wasm32)
            os: ubuntu-latest
            platform: web
            arch: wasm32

          - name: ⚙️ no_std (build verification)
            os: ubuntu-latest
            platform: no_std
            arch: x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: setup for SpriteStudio7-SDK
        uses: ./.github/actions/setup
        with:
          platform: ${{ matrix.platform }}
          os: ${{ matrix.os }}

      - name: Install targets (Rust)
        run: |
          if [ "${{ matrix.platform }}" == "macos" ]; then
            rustup target add aarch64-apple-darwin
          elif [ "${{ matrix.platform }}" == "ios" ]; then
            rustup target add aarch64-apple-ios
          elif [ "${{ matrix.platform }}" == "android" ]; then
            rustup target add aarch64-linux-android
            cargo install cargo-ndk
          elif [ "${{ matrix.platform }}" == "web" ]; then
            rustup target add wasm32-unknown-unknown
          fi
        shell: bash

      - name: Build
        run: |
          if [ "${{ matrix.platform }}" == "android" ]; then
            cargo ndk --target aarch64-linux-android build --verbose -p ssruntime --features "libc_alloc,panic-handler"
          elif [ "${{ matrix.platform }}" == "ios" ]; then
            cargo build --target aarch64-apple-ios --verbose -p ssruntime --features "libc_alloc,panic-handler"
          elif [ "${{ matrix.platform }}" == "web" ]; then
            cargo build --target wasm32-unknown-unknown --verbose -p ssruntime --no-default-features --features "ffi,std"
            cargo build --target wasm32-unknown-unknown --verbose -p ssruntime --no-default-features --features "web"
          elif [ "${{ matrix.platform }}" == "no_std" ]; then
            cargo build --release --verbose -p ssruntime --features "libc_alloc,panic-handler"
          else
            cargo build --verbose
            cargo build --verbose -p ssruntime --features "libc_alloc,panic-handler"
          fi
        shell: bash

      - name: Test (workspace)
        if: matrix.platform == 'linux' || matrix.platform == 'windows' || matrix.platform == 'macos'
        run: cargo test --workspace --all-features --verbose -- --test-threads=1
        shell: bash
