name: CI

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - '.gitignore'
      - 'LICENSE*'
  workflow_dispatch:

env:
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8
  PYTHONIOENCODING: utf8
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-cargo-${{ github.actor }}-${{ github.head_ref || github.run_number }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: 💅 Lint & Format
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          submodules: recursive

      - name: setup for SpriteStudio-SDK
        uses: ./.github/actions/setup
        with:
          platform: linux
          os: ubuntu-latest

      - name: Format Check
        run: cargo fmt --all -- --check
        shell: bash

      # --all-features, like the rustdoc step below: the test modules sit behind
      # `feature = "std"`, so without it the largest body of code in the
      # workspace is the one part clippy never sees.
      - name: Clippy (workspace)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
        shell: bash

      # Catches broken intra-doc links, which `cargo test --doc` does not see.
      - name: Rustdoc (workspace)
        run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
        shell: bash

  ci:
    name: ${{ matrix.name }}
    needs: lint
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 🐧 Linux (GCC)
            os: ubuntu-latest
            platform: linux
            arch: x86_64

          - name: 🌐 Web (wasm32)
            os: ubuntu-latest
            platform: web
            arch: wasm32

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          submodules: recursive

      - name: setup for SpriteStudio-SDK
        uses: ./.github/actions/setup
        with:
          platform: ${{ matrix.platform }}
          os: ${{ matrix.os }}

      - name: Install targets (Rust)
        if: matrix.platform == 'web'
        run: |
          rustup target add wasm32-unknown-unknown
          # Nightly is required for PIC support in wasm32-unknown-unknown (Godot GDExtension)
          rustup toolchain install nightly
          rustup target add wasm32-unknown-unknown --toolchain nightly
          rustup component add rust-src --toolchain nightly
        shell: bash

      - name: Build
        run: |
          if [ "${{ matrix.platform }}" == "web" ]; then
            # Build for general FFI and Web (Stable)
            cargo build --target wasm32-unknown-unknown --verbose -p ssruntime-ffi --no-default-features --features "ffi,std"
            cargo build --target wasm32-unknown-unknown --verbose -p ssruntime-ffi --no-default-features --features "web"

            # Browser converter (shipped as lib/converter-web by release-web.sh).
            # rayon spans ssconverter AND sspj, so this is the only check that the
            # sequential `parallel`-off fallback still compiles for wasm32.
            cargo build --target wasm32-unknown-unknown --verbose -p ssconverter --no-default-features --features "web"

            # Build for Godot GDExtension (Nightly + PIC)
            export RUSTFLAGS="-C relocation-model=pic"
            cargo +nightly rustc -Z build-std=core,alloc \
              --target wasm32-unknown-unknown \
              --verbose \
              -p ssruntime-ffi \
              --no-default-features \
              --features "wasm_alloc,panic-handler" \
              --crate-type staticlib,rlib

            # Emscripten deliverable (release.yml ships its .a). Needs no emsdk —
            # the nightly toolchain and wasm target installed above are enough.
            ./scripts/release-emscripten.sh
          else
            cargo build --verbose
            cargo build --verbose -p ssruntime-ffi --features "libc_alloc,panic-handler"

            # Custom-allocator (console/engine) build. staticlib only: the
            # ss_custom_* symbols stay unresolved until the host links them, so a
            # cdylib link would fail standalone on macOS/MSVC.
            cargo rustc --verbose -p ssruntime-ffi --features "custom_alloc,panic-handler" --crate-type staticlib
          fi
        shell: bash

      - name: Test (workspace)
        if: matrix.platform == 'linux'
        run: cargo test --workspace --all-features --verbose -- --test-threads=1
        shell: bash

  msrv:
    name: 🦀 MSRV (declared rust-version)
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          submodules: recursive

      - name: Extract MSRV from Cargo.toml
        id: msrv
        run: |
          msrv=$(grep -E '^rust-version = ' Cargo.toml | sed -E 's/rust-version = "(.+)"/\1/')
          if [ -z "$msrv" ]; then
            echo "::error::rust-version not found in workspace Cargo.toml"
            exit 1
          fi
          echo "version=$msrv" >> "$GITHUB_OUTPUT"
          echo "Declared MSRV: $msrv"
        shell: bash

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: Setup Rust cache (MSRV)
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: cargo check (workspace, all targets, all features)
        run: cargo check --workspace --all-targets --all-features --locked
        shell: bash

  audit:
    name: 🔒 Security audit (cargo-audit)
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Install cargo-audit
        uses: taiki-e/install-action@07b4745e0c39a41822af610387492e3e53aa222b # v2
        with:
          tool: cargo-audit

      - name: Run cargo audit
        run: cargo audit
        shell: bash
