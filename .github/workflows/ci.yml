name: CI

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - '.gitignore'
      - 'LICENSE*'
  workflow_dispatch:

env:
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8
  PYTHONIOENCODING: utf8
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-cargo-${{ github.actor }}-${{ github.head_ref || github.run_number }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: 💅 Lint & Format
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: setup for SpriteStudio7-SDK
        uses: ./.github/actions/setup
        with:
          platform: linux
          os: ubuntu-latest

      - name: Format Check
        run: cargo fmt --all -- --check
        shell: bash

      - name: Clippy (workspace)
        run: cargo clippy --workspace --all-targets -- -D warnings
        shell: bash

  ci:
    name: ${{ matrix.name }}
    needs: lint
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 🐧 Linux (GCC)
            os: ubuntu-latest
            platform: linux
            arch: x86_64

          - name: 🌐 Web (wasm32)
            os: ubuntu-latest
            platform: web
            arch: wasm32

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: setup for SpriteStudio7-SDK
        uses: ./.github/actions/setup
        with:
          platform: ${{ matrix.platform }}
          os: ${{ matrix.os }}

      - name: Install targets (Rust)
        if: matrix.platform == 'web'
        run: |
          rustup target add wasm32-unknown-unknown
          # Nightly is required for PIC support in wasm32-unknown-unknown (Godot GDExtension)
          rustup toolchain install nightly
          rustup target add wasm32-unknown-unknown --toolchain nightly
          rustup component add rust-src --toolchain nightly
        shell: bash

      - name: Build
        run: |
          if [ "${{ matrix.platform }}" == "web" ]; then
            # Build for general FFI and Web (Stable)
            cargo build --target wasm32-unknown-unknown --verbose -p ssruntime --no-default-features --features "ffi,std"
            cargo build --target wasm32-unknown-unknown --verbose -p ssruntime --no-default-features --features "web"
            
            # Build for Godot GDExtension (Nightly + PIC)
            export RUSTFLAGS="-C relocation-model=pic"
            cargo +nightly rustc -Z build-std=core,alloc \
              --target wasm32-unknown-unknown \
              --verbose \
              -p ssruntime \
              --no-default-features \
              --features "wasm_alloc,panic-handler" \
              --crate-type staticlib,rlib
          else
            cargo build --verbose
            cargo build --verbose -p ssruntime --features "libc_alloc,panic-handler"
          fi
        shell: bash

      - name: Test (workspace)
        if: matrix.platform == 'linux'
        run: cargo test --workspace --all-features --verbose -- --test-threads=1
        shell: bash

  msrv:
    name: 🦀 MSRV (declared rust-version)
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Extract MSRV from Cargo.toml
        id: msrv
        run: |
          msrv=$(grep -E '^rust-version = ' Cargo.toml | sed -E 's/rust-version = "(.+)"/\1/')
          if [ -z "$msrv" ]; then
            echo "::error::rust-version not found in workspace Cargo.toml"
            exit 1
          fi
          echo "version=$msrv" >> "$GITHUB_OUTPUT"
          echo "Declared MSRV: $msrv"
        shell: bash

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: cargo check (workspace, all targets, all features)
        run: cargo check --workspace --all-targets --all-features --locked
        shell: bash

  audit:
    name: 🔒 Security audit (cargo-audit)
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Run cargo audit
        run: cargo audit
        shell: bash
