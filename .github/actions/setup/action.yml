name: Setup
description: Setup build dependencies for SpriteStudio-SDK

inputs:
  platform:
    required: true
    description: Target platform.
  os:
    required: true
    description: build host os.

runs:
  using: composite
  steps:
    - name: Setup Rust toolchain
      uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
      with:
        # Pinned by SHA, so the channel must be named explicitly here.
        toolchain: stable
        components: clippy, rustfmt

    - name: Setup Rust cache
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        # The key is the job id and the runner OS, which the jobs of one matrix
        # share. Without the platform they would share one cache: only the first
        # to finish could save it, and the others would restore its target dir.
        key: ${{ inputs.platform }}

    - name: Setup Android dependencies
      if: inputs.platform == 'android'
      uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1.6.0
      with:
        ndk-version: r23c
        link-to-sdk: true
