name: Setup
description: Setup build dependencies for SpriteStudio-SDK

inputs:
  platform:
    required: true
    description: Target platform.
  os:
    required: true
    description: build host os.

runs:
  using: composite
  steps:
    - name: Setup Rust toolchain
      uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      with:
        # Pinned by SHA, so the channel must be named explicitly here.
        toolchain: stable
        components: clippy, rustfmt

    - name: Setup Rust cache
      uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

    - name: Setup Android dependencies
      if: inputs.platform == 'android'
      uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
      with:
        ndk-version: r23c
        link-to-sdk: true
