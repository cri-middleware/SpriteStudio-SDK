name: ✨ Feature request / 要望
description: Suggest a new capability or an improvement. / 新機能や改善のご提案。
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please check [ROADMAP.md](https://github.com/cri-middleware/SpriteStudio-SDK/blob/HEAD/ROADMAP.md)
        first — it lists what is planned, and what is deliberately not on the roadmap.

        まず [ROADMAP.md](https://github.com/cri-middleware/SpriteStudio-SDK/blob/HEAD/ROADMAP.md) をご確認ください。予定済みの項目と、意図的にロードマップに載せていない項目が記載されています。

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve? / 解決したい課題
      description: |
        Describe the situation you are stuck in, not just the feature you have in mind — it often
        leads to a better answer.
        ご要望の機能そのものより、お困りの状況をお書きください。より良い解決策が見つかることがあります。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like it to do? / ご提案の内容
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What are you doing today instead? / 現在の回避方法
      description: Workarounds you have tried, and why they fall short. / 試した回避策と、不十分な点。

  - type: dropdown
    id: scope
    attributes:
      label: Where does this belong? / 対象範囲
      description: |
        This repository owns the converter, the shared runtime, their C ABI and wasm faces, and
        the porting guide. Drawing, audio and engine integration belong to each player. Unsure is fine.
        本リポジトリはコンバーター、共通ランタイム、その C ABI と wasm、移植ガイドを扱います。描画・音声・エンジンとの統合は各 Player 側です。わからない場合はそのままで構いません。
      options:
        - Converter (.sspj → .ssab / .ssqb)
        - Runtime (playback behaviour)
        - C ABI or wasm faces
        - Porting guide / documentation
        - A player, not the SDK / Player 側
        - Not sure / わからない
