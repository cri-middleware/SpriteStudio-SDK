[package]
name = "ssconverter-cli"
# Ships as binaries on the GitHub Release, not through crates.io.
publish = false
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Command-line converter from SpriteStudio projects to .ssab / .ssqb runtime binaries"
keywords = ["spritestudio", "2d-animation", "gamedev", "cli", "converter"]
categories = ["command-line-utilities", "game-development"]

[dependencies]
clap = { workspace = true }
rayon = { workspace = true }
# The CLI is the native path by definition: it walks directories and converts in parallel.
ssconverter = { workspace = true, features = ["native"] }

[build-dependencies]
vergen-gitcl = { workspace = true }
