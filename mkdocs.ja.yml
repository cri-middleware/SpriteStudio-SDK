INHERIT: ./mkdocs.base.yml

docs_dir: build/docs/ja
site_dir: site/ja
site_url: "https://cri-middleware.github.io/SpriteStudio-SDK/ja/"
site_description: "SpriteStudio SDK の Player 移植ガイド - 任意のエンジンに SpriteStudio Player を実装する"

theme:
  language: ja

extra:
  site_root_prefix: "../"
  social:
    - icon: material/motion-play
      link: https://cri-middleware.github.io/SpriteStudio-Docs/ja/
      name: SpriteStudio Docs（ポータル）
    - icon: fontawesome/brands/github
      link: https://github.com/cri-middleware
      name: GitHub の cri-middleware
    - icon: material/web
      link: https://www.webtech.co.jp/spritestudio/
      name: SpriteStudio
    - icon: fontawesome/brands/x-twitter
      link: https://x.com/spritestudio
      name: X の SpriteStudio

nav:
  - 🏠 ホーム: README.md
  - 🚀 はじめに:
      - 概要: 10_introduction/10_overview.md
      - 制限事項: 10_introduction/20_limitations.md
      - 用語集: 10_introduction/30_glossary.md
  - 🧭 設計:
      - 事前確認とプロジェクトの準備: 20_design/10_preparation.md
      - Player の設計方針: 20_design/20_architecture.md
      - Player API 規約: 20_design/30_api_conventions.md
      - no_std 環境への統合: 20_design/40_no_std_integration.md
  - 🎬 基本の再生:
      - ロードと初期化: 30_core/10_initialization.md
      - 再生制御: 30_core/20_playback_control.md
      - イベント: 30_core/30_events.md
      - 描画ループ: 30_core/40_render_loop.md
  - 🧩 パーツ:
      - パーツカラー: 40_parts/10_parts_color.md
      - メッシュ: 40_parts/20_mesh.md
      - 9 スライス・シェイプ・テキスト: 40_parts/30_special_parts.md
      - マスク: 40_parts/40_mask.md
      - インスタンスパーツ: 40_parts/50_instance.md
      - エフェクトパーツ: 40_parts/60_effect.md
  - ✨ 機能:
      - アニメーションミキシング: 50_features/10_animation_mixing.md
      - パーツオーバーライド: 50_features/20_part_overrides.md
      - 外部リソースとテクスチャ: 50_features/30_external_resources.md
      - シーケンス: 50_features/40_sequence.md
      - オーディオ: 50_features/50_audio.md
      - エディタ統合: 50_features/60_editor_integration.md
      - 配置（fit と align）: 50_features/70_placement.md
      - UI 統合: 50_features/80_ui_integration.md
  - 🛠️ トラブルシューティング: 60_troubleshooting/10_troubleshooting.md
  - 📦 Rust API (rustdoc): ../api/ssruntime/index.html
