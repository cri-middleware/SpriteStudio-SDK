[package]
name = "ssruntime"
version = "7.0.0"
edition.workspace = true

[dependencies]
flatbuffers = { workspace = true }
ssab = { workspace = true }
ssinterpolate = { workspace = true }
libm = { workspace = true }
wasm-bindgen = { workspace = true, optional = true }

[features]
default = ["ffi", "std"]
ffi = []
web = ["wasm-bindgen"]
std = ["flatbuffers/std", "ssab/std"]

[lints.clippy]
missing_safety_doc = "allow"
too_many_arguments = "allow"
not_unsafe_ptr_arg_deref = "allow"

[dev-dependencies]
ssconverter = { workspace = true }

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[build-dependencies]
cbindgen = { workspace = true }
csbindgen = "1.9.7"
