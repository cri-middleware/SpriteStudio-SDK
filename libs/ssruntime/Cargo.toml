[package]
name = "ssruntime"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description.workspace = true

[dependencies]
flatbuffers = { workspace = true }
ssab = { workspace = true }
ssinterpolate = { workspace = true }
libm = { workspace = true }
wasm-bindgen = { workspace = true, optional = true }
dlmalloc = { workspace = true, optional = true, features = ["global"] }
libc = { version = "0.2.186", optional = true }
ssconverter = { workspace = true, optional = true }
wide = { workspace = true }

[features]
default = ["ffi"]
ffi = []
web = ["wasm-bindgen/std"]
std = ["flatbuffers/std", "ssab/std", "dep:ssconverter", "wasm-bindgen/std"]
libc_alloc = ["dep:libc"]
wasm_alloc = ["dep:dlmalloc"]
emscripten_alloc = []
custom_alloc = []
panic-handler = []

[lints.clippy]
too_many_arguments = "allow"

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

# Enable exactly the wasm features rustc emits (`+simd128` from `.cargo/config.toml`
# plus its wasm32 defaults). Do NOT use `--all-features`: on newer wasm-opt (v112+)
# it also enables experimental *output* proposals, producing type encodings that
# browsers/V8 reject at instantiation ("invalid value type" in `wasm.initialize`).
# There is no `target_features` custom section to auto-detect, so these are required.
[package.metadata.wasm-pack.profile.release]
wasm-opt = [
    "-Oz",
    "--enable-simd",
    "--enable-bulk-memory",
    "--enable-mutable-globals",
    "--enable-sign-ext",
    "--enable-nontrapping-float-to-int",
    "--enable-multivalue",
    "--enable-reference-types",
]

[build-dependencies]
cbindgen = { workspace = true }
csbindgen = { workspace = true }
