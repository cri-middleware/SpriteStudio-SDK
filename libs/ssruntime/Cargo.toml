[package]
name = "ssruntime"
version = "0.1.0"
edition = "2024"

[dependencies]
flatbuffers = { version = "25.9.23", features = ["default"] }
ssab = { path = "../ssab" }

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
panic = "abort"
strip = "symbols"
