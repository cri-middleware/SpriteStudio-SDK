[package]
name = "ssruntime"
version = "0.1.0"
edition = "2024"

[dependencies]
flatbuffers = { version = "25.12.19", features = ["default"] }
ssab = { path = "../ssab", features = ["default"] }
wasm-bindgen = { version = "0.2.108", optional = true }

[features]
default = ["ffi"]
ffi = []
web = ["wasm-bindgen"]

[dev-dependencies]
ssconverter3 = { path = "../ssconverter3" }

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[build-dependencies]
cbindgen = "0.29.2"
csbindgen = "1.9.7"
