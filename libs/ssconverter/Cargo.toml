[package]
name = "ssconverter"
version = "7.0.0"
edition = "2024"

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
zip = "8.1.0"
flatbuffers = "25.12.19"
rayon = "1.11.0"
walkdir = "2.5.0"
ordered-float = "5.1.0"
sspj = { path = "../sspj" }
ssab = { path = "../ssab", features = ["converter"] }
ssinterpolate = { path = "../ssinterpolate" }
wasm-bindgen = { version = "0.2.108", optional = true }
notify-debouncer-mini = "0.7.0"

[features]
default = ["ffi"]
ffi = []
web = ["wasm-bindgen"]

[build-dependencies]
cbindgen = "0.29.2"
vergen-gitcl = { version = "9.1.0", features = ["build"] }
