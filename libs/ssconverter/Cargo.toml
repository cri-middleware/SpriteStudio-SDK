[package]
name = "ssconverter"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description.workspace = true

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
flatbuffers = { workspace = true, features = ["std"] }
ordered-float = "5.3.0"
sspj = { workspace = true }
ssab = { workspace = true, features = ["converter"] }
rayon = { workspace = true, optional = true }
walkdir = { version = "2.5.0", optional = true }
wasm-bindgen = { workspace = true, optional = true }
js-sys = { version = "0.3.103", optional = true }

[features]
default = ["ffi"]
# C-API exports. Requires the native (filesystem) conversion paths.
ffi = ["native"]
# Native build (CLI / Tauri backend): parallel conversion, filesystem I/O,
# and directory scanning.
native = ["parallel", "scan"]
# Parallel conversion via rayon. Propagates to sspj's parallel parsing.
parallel = ["dep:rayon", "sspj/parallel"]
# Directory traversal for batch conversion (CLI).
scan = ["dep:walkdir"]
# Browser WASM bindings (wasm32-unknown-unknown). Implies sequential
# conversion since rayon cannot spawn threads there.
# Build with: --no-default-features --features web
web = ["dep:wasm-bindgen", "wasm-bindgen/std", "dep:js-sys"]

# Browser WASM packaging (wasm-pack). SIMD is disabled at compile time by
# `release-web.sh` (RUSTFLAGS=-simd128; the repo-wide `+simd128` in
# `.cargo/config.toml` is for the runtime, not the converter). Enable exactly
# rustc's default wasm32 features so wasm-opt accepts the input; `--enable-simd`
# is intentionally omitted so the output stays SIMD-free. Do NOT use
# `--all-features`: on newer wasm-opt (v112+) it also enables experimental
# *output* proposals, producing type encodings that browsers/V8 reject at
# instantiation ("invalid value type" in `wasm.initialize`). `-Oz` keeps it small.
[package.metadata.wasm-pack.profile.release]
wasm-opt = [
    "-Oz",
    "--enable-bulk-memory",
    "--enable-mutable-globals",
    "--enable-sign-ext",
    "--enable-nontrapping-float-to-int",
    "--enable-multivalue",
    "--enable-reference-types",
]

[lints.clippy]
field_reassign_with_default = "allow"
missing_safety_doc = "allow"
module_inception = "allow"
no_effect = "allow"
unnecessary_get_then_check = "allow"

[build-dependencies]
cbindgen = { workspace = true }
vergen-gitcl = { workspace = true }
csbindgen = { workspace = true }
