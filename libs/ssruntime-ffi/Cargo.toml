[package]
name = "ssruntime-ffi"
publish = false
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description.workspace = true

[lib]
name = "ssruntime"
crate-type = ["staticlib", "cdylib"]
doc = false

[dependencies]
ssruntime = { workspace = true }

[features]
default = ["ffi"]
ffi = ["ssruntime/ffi"]
web = ["ssruntime/web"]
std = ["ssruntime/std"]
libc_alloc = ["ssruntime/libc_alloc"]
wasm_alloc = ["ssruntime/wasm_alloc"]
emscripten_alloc = ["ssruntime/emscripten_alloc"]
custom_alloc = ["ssruntime/custom_alloc"]
panic-handler = ["ssruntime/panic-handler"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = [
    "-Oz",
    "--enable-simd",
    "--enable-bulk-memory",
    "--enable-mutable-globals",
    "--enable-sign-ext",
    "--enable-nontrapping-float-to-int",
    "--enable-multivalue",
    "--enable-reference-types",
]

[build-dependencies]
cbindgen = { workspace = true }
csbindgen = { workspace = true }
