[package]
name = "ssconverter3"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
flatbuffers = "25.12.19"
rayon = "1.11.0"
walkdir = "2.5.0"
ordered-float = "5.1.0"
sspj = { path = "../sspj" }
ssab = { path = "../ssab", features = ["converter"] }

# ffi
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
libc = "0.2.180"

[build-dependencies]
cbindgen = "0.29.2"
