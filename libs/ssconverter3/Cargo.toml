[package]
name = "ssconverter3"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
flatbuffers = "25.12.19"
rayon = "1.11.0"
walkdir = "2.5.0"
ordered-float = "5.1.0"
sspj = { path = "../sspj" }
ssab = { path = "../ssab", features = ["converter"] }
ssanimator = { path = "../ssanimator" }

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
panic = "abort"
strip = "symbols"
