[package]
name = "sspj"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Parser for SpriteStudio project files (.sspj / .ssae / .ssce / .ssee / .ssqe / .ssse)"
keywords = ["spritestudio", "animation", "gamedev", "parser", "xml"]
categories = ["parser-implementations", "game-development", "graphics"]

[lib]
crate-type = ["rlib"]

[dependencies]
serde = { workspace = true }
quick-xml = { workspace = true }
rayon = { workspace = true, optional = true }

[features]
default = ["parallel"]
# Parallel parsing via rayon. Disable (e.g. for wasm32 targets, where rayon
# cannot spawn threads) to fall back to sequential iteration.
parallel = ["dep:rayon"]

