# English site -- the default locale, so it builds to the site root and keeps the plain
# `mkdocs.yml` name that the tooling looks for when no `-f` is given.
#
# `docs_dir` points at a **generated** tree, not at the guide as authored. The pages live in
# `libs/ssruntime/docs` with each one next to its `.ja.md` translation, which is what makes
# them readable on GitHub and lets SpriteStudio-Docs deep-link them; Zensical needs one
# directory per locale. `scripts/build-docs-tree.py` bridges the two and must run first.
#
# Everything not listed here comes from mkdocs.base.yml. Before adding anything, read the
# note there about sequences: `nav` and `extra.social` are defined in this file and in
# mkdocs.ja.yml, and must never also appear in the base.
INHERIT: ./mkdocs.base.yml

docs_dir: build/docs/en
site_dir: site
site_url: "https://cri-middleware.github.io/SpriteStudio-SDK/"
site_description: "Player Porting Guide for the SpriteStudio SDK - implement a SpriteStudio 7 player on any engine"

theme:
  # Drives the UI string translations and the `html lang` attribute.
  language: en

extra:
  # English builds to the site root, so the root of the whole multi-locale site is right
  # here. The language selector prepends this to its target; see
  # overrides/partials/alternate.html.
  site_root_prefix: ""
  # Footer icons. Keep to destinations that outlive any single release. Mirrored, with
  # translated labels, in mkdocs.ja.yml - add or reorder an icon in both files.
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/cri-middleware
      name: cri-middleware on GitHub
    - icon: material/web
      link: https://www.webtech.co.jp/spritestudio/
      name: OPTPiX SpriteStudio
    # Keep the handle here in sync with `twitter:site` in overrides/main.html.
    - icon: fontawesome/brands/x-twitter
      link: https://x.com/spritestudio
      name: SpriteStudio on X

# Mirrors the table of contents in README.md; the numeric directory prefixes are the reading
# order, so keep the two in step when a page is added. Paths are locale-relative and
# identical to the ones in mkdocs.ja.yml; only the labels differ. The one exception is the
# last entry, which leaves `docs_dir` for the rustdoc build-pages.sh grafts onto site/api/.
nav:
  - 🏠 Home: README.md
  - 🚀 Introduction:
      - Introduction & Glossary: 10_introduction/10_introduction.md
      - Limitations: 10_introduction/20_limitations.md
  - 🧭 Design:
      - Preparation & Prerequisites: 20_design/10_preparation.md
      - Architecture & Implementation Approach: 20_design/20_architecture.md
      - Implementation Roadmap: 20_design/30_implementation_roadmap.md
  - 🎬 Core Playback:
      - Loading & Initialization: 30_core/10_initialization.md
      - Playback Control & Events: 30_core/20_playback_control.md
      - Rendering Loop & Batching: 30_core/30_render_loop.md
  - 🧩 Components:
      - Instance Parts: 40_components/10_instance.md
      - Effect Parts: 40_components/20_effect.md
      - Mesh & Deform: 40_components/30_mesh.md
      - Mask: 40_components/40_mask.md
      - Parts Color: 40_components/50_parts_color.md
      - Animation Blending: 40_components/60_animation_blending.md
      - Part Overrides: 40_components/65_override_layer.md
      - External Resources & Textures: 40_components/70_external_resources.md
      - Sequence: 40_components/80_sequence.md
      - Audio: 40_components/90_audio.md
      - Special Part Types: 40_components/95_special_parts.md
  - 📚 Reference:
      - no_std Integration: 50_reference/10_no_std_integration.md
      - Troubleshooting: 50_reference/20_troubleshooting.md
  - 🛠️ Tooling:
      - Editor Integration & Conversion: 60_tooling/10_editor_integration.md
  - 📦 Rust API (rustdoc): api/ssruntime/index.html
